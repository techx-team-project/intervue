name: intervue_flutter
description: "Recruitment app (TopCV-like) - Flutter client for Spring Boot backend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.0

  # Network & Data Modeling
  dio: ^5.8.0+1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Local Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Dependency Injection
  get_it: ^8.0.3

  # UI & Media Helpers
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  file_picker: 8.3.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1
  freezed: ^4.0.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
