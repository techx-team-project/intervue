templates:
  BUSINESS_DOCUMENT_APPROVED:
    title: "Tài liệu {documentLabel} đã được phê duyệt"
    summary: "Tài liệu {documentLabel} của {companyName} đã được quản trị viên phê duyệt."
    body: |
      Quản trị viên InterVue đã phê duyệt tài liệu **{documentLabel}** của **{companyName}**.

      Hiệu lực đến: **{expiresAt}**

      Khi tài liệu hết hạn, quyền đăng tin tuyển dụng của bạn sẽ tạm dừng cho đến khi bạn nộp bản mới.
    actionLabel: "Xem hồ sơ xác thực"

  BUSINESS_DOCUMENT_REJECTED:
    title: "Tài liệu {documentLabel} bị từ chối"
    summary: "Tài liệu {documentLabel} của {companyName} chưa đạt yêu cầu và đã bị từ chối."
    body: |
      Tài liệu **{documentLabel}** của **{companyName}** chưa đạt yêu cầu xác thực.

      **Lý do:** {reason}

      Bạn có thể nộp lại tài liệu sau khi đã khắc phục.
    actionLabel: "Nộp lại tài liệu"

  BUSINESS_DOCUMENT_MORE_INFO:
    title: "Cần bổ sung thông tin cho tài liệu {documentLabel}"
    summary: "Quản trị viên yêu cầu bổ sung thông tin cho tài liệu {documentLabel} của {companyName}."
    body: |
      Quản trị viên cần thêm thông tin để hoàn tất thẩm định tài liệu **{documentLabel}** của **{companyName}**.

      **Nội dung cần bổ sung:** {reason}

      Hồ sơ của bạn vẫn đang được giữ trong hàng chờ xử lý.
    actionLabel: "Bổ sung ngay"

  BUSINESS_DOCUMENT_REVOKED:
    title: "Tài liệu {documentLabel} đã bị thu hồi"
    summary: "Tài liệu {documentLabel} của {companyName} đã bị thu hồi hiệu lực."
    body: |
      Quản trị viên đã thu hồi hiệu lực tài liệu **{documentLabel}** của **{companyName}**.

      **Lý do:** {reason}

      Quyền đăng tin tuyển dụng gắn với tài liệu này đã tạm dừng.
    actionLabel: "Xem hồ sơ xác thực"

  BUSINESS_DOCUMENT_EXPIRED:
    title: "Tài liệu {documentLabel} đã hết hạn"
    summary: "Tài liệu {documentLabel} của {companyName} đã hết hiệu lực từ {expiresAt}."
    body: |
      Tài liệu **{documentLabel}** của **{companyName}** đã hết hiệu lực từ **{expiresAt}**.

      Quyền đăng tin tuyển dụng gắn với tài liệu này đã tạm dừng. Vui lòng nộp bản cập nhật để khôi phục.
    actionLabel: "Cập nhật tài liệu"

  PUBLISH_RIGHT_LOST:
    title: "Quyền đăng tin tuyển dụng đã tạm dừng"
    summary: "Tài khoản của bạn tại {companyName} hiện không còn quyền đăng tin tuyển dụng."
    body: |
      Tài khoản của bạn tại **{companyName}** hiện không còn quyền đăng tin tuyển dụng.

      **Nguyên nhân:** {cause}

      Các tin đang hiển thị không bị gỡ, nhưng bạn không thể đăng tin mới hoặc nhận hồ sơ ứng tuyển cho đến khi hoàn tất xác thực lại.
    actionLabel: "Xác thực lại"

  COMPANY_VERIFIED:
    title: "Doanh nghiệp {companyName} đã được xác thực"
    summary: "Hồ sơ doanh nghiệp {companyName} đã hoàn tất xác thực."
    body: |
      Hồ sơ doanh nghiệp **{companyName}** đã được xác thực thành công.

      Trang doanh nghiệp của bạn sẽ hiển thị huy hiệu đã xác thực với ứng viên.
    actionLabel: "Xem trang doanh nghiệp"

  COMPANY_MEMBERSHIP_CHANGED:
    title: "Tư cách thành viên tại {companyName} đã thay đổi"
    summary: "{change}"
    body: |
      Tư cách thành viên của bạn tại **{companyName}** vừa được cập nhật.

      **Chi tiết:** {change}

      Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ người sở hữu doanh nghiệp hoặc bộ phận hỗ trợ.
    actionLabel: "Xem doanh nghiệp"

  AGREEMENT_REVIEWED:
    title: "Thoả thuận xử lý dữ liệu cá nhân {outcome}"
    summary: "Thoả thuận xử lý dữ liệu cá nhân của {companyName} đã được thẩm định."
    body: |
      Thoả thuận xử lý dữ liệu cá nhân của **{companyName}** đã được thẩm định với kết quả: **{outcome}**.

      **Ghi chú của quản trị viên:** {reason}
    actionLabel: "Xem thoả thuận"

  FOLLOWED_COMPANY_NEW_JOB:
    title: "{companyName} vừa đăng tin tuyển dụng mới"
    summary: "{companyName} đang tuyển vị trí {jobTitle}."
    body: |
      Công ty **{companyName}** mà bạn đang theo dõi vừa đăng tin tuyển dụng vị trí **{jobTitle}**.

      Bạn có thể tắt thông báo này trong phần cài đặt thông báo.
    actionLabel: "Xem tin tuyển dụng"

  JOB_HIDDEN_BY_ADMIN:
    title: "Tin tuyển dụng {jobTitle} đã bị ẩn"
    summary: "Quản trị viên đã ẩn tin {jobTitle} khỏi kết quả tìm kiếm."
    body: |
      Quản trị viên InterVue đã ẩn tin tuyển dụng **{jobTitle}** khỏi kết quả tìm kiếm.

      **Lý do:** {reason}

      Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ bộ phận hỗ trợ.
    actionLabel: "Xem tin tuyển dụng"

  JOB_TERMS_CHANGED_FOR_APPLICANT:
    title: "{jobTitle} was updated"
    summary: "{companyName} changed the {changes} of a job you applied to."
    body: |
      **{companyName}** changed the **{changes}** of the **{jobTitle}** posting after you applied.

      Review the updated posting. If it no longer suits you, you can withdraw your application.
    actionLabel: "View my applications"

  JOB_HIDDEN_FOR_APPLICANT:
    title: "The {jobTitle} job is no longer visible"
    summary: "{companyName}'s {jobTitle} posting was hidden by an administrator."
    body: |
      The **{jobTitle}** posting at **{companyName}** was hidden by an InterVue administrator.

      Your application is kept as it is, but new applications are no longer accepted for this posting.
    actionLabel: "View my applications"

  JOB_RESTORED_BY_ADMIN:
    title: "Tin tuyển dụng {jobTitle} đã được khôi phục"
    summary: "Tin {jobTitle} đã được quản trị viên khôi phục."
    body: |
      Tin tuyển dụng **{jobTitle}** đã được quản trị viên InterVue khôi phục.
    actionLabel: "Xem tin tuyển dụng"

  APPLICATION_RECEIVED:
    title: "Có hồ sơ ứng tuyển mới cho {jobTitle}"
    summary: "Một ứng viên vừa nộp hồ sơ vào vị trí {jobTitle}."
    body: |
      Một ứng viên vừa nộp hồ sơ vào vị trí **{jobTitle}**.

      Hãy xem hồ sơ và cập nhật trạng thái để ứng viên biết tiến độ.
    actionLabel: "Xem hồ sơ ứng tuyển"

  APPLICATION_STATUS_CHANGED:
    title: "Hồ sơ {jobTitle} {status}"
    summary: "Hồ sơ ứng tuyển của bạn tại {companyName} {status}."
    body: |
      Hồ sơ ứng tuyển vị trí **{jobTitle}** tại **{companyName}** {status}.
    actionLabel: "Xem tin tuyển dụng"

  INTERVIEW_INVITED:
    title: "Lời mời phỏng vấn từ {companyName}"
    summary: "{companyName} mời bạn phỏng vấn vị trí {jobTitle} vào {when}."
    body: |
      **{companyName}** mời bạn phỏng vấn vị trí **{jobTitle}**.

      **Thời gian:** {when}

      Hãy xác nhận tham gia hoặc đề xuất một thời gian khác nếu bạn bận.
    actionLabel: "Xem lịch phỏng vấn"

  INTERVIEW_UPDATED:
    title: "Lịch phỏng vấn tại {companyName} đã thay đổi"
    summary: "Lịch phỏng vấn vị trí {jobTitle} đã được cập nhật: {when}."
    body: |
      Lịch phỏng vấn vị trí **{jobTitle}** tại **{companyName}** đã được cập nhật.

      **Thời gian:** {when}
    actionLabel: "Xem lịch phỏng vấn"

  INTERVIEW_CANCELLED:
    title: "Lịch phỏng vấn tại {companyName} đã bị huỷ"
    summary: "{companyName} đã huỷ buổi phỏng vấn vị trí {jobTitle}."
    body: |
      **{companyName}** đã huỷ buổi phỏng vấn vị trí **{jobTitle}**.
    actionLabel: "Xem lịch phỏng vấn"

  INTERVIEW_CONFIRMED:
    title: "{candidateName} đã xác nhận phỏng vấn"
    summary: "{candidateName} sẽ tham gia phỏng vấn vị trí {jobTitle} vào {when}."
    body: |
      **{candidateName}** đã xác nhận tham gia phỏng vấn vị trí **{jobTitle}**.

      **Thời gian:** {when}
    actionLabel: "Xem hồ sơ ứng tuyển"

  INTERVIEW_DECLINED:
    title: "{candidateName} đã từ chối phỏng vấn"
    summary: "{candidateName} không thể tham gia phỏng vấn vị trí {jobTitle}."
    body: |
      **{candidateName}** đã từ chối lời mời phỏng vấn vị trí **{jobTitle}**.
    actionLabel: "Xem hồ sơ ứng tuyển"

  INTERVIEW_RESCHEDULE_REQUESTED:
    title: "{candidateName} xin đổi lịch phỏng vấn"
    summary: "{candidateName} đề xuất một thời gian khác cho buổi phỏng vấn vị trí {jobTitle}."
    body: |
      **{candidateName}** bận vào thời gian đã hẹn và đề xuất một thời gian khác cho vị trí **{jobTitle}**.

      Hãy mở hồ sơ để đồng ý hoặc chọn lại thời gian.
    actionLabel: "Xem hồ sơ ứng tuyển"

  INTERVIEW_REMINDER:
    title: "Buổi phỏng vấn bắt đầu sau {lead}"
    summary: "Phỏng vấn vị trí {jobTitle} tại {companyName} bắt đầu sau {lead}."
    body: |
      Buổi phỏng vấn vị trí **{jobTitle}** tại **{companyName}** sẽ bắt đầu vào **{when}**.
    actionLabel: "Xem lịch phỏng vấn"

  APPLICATION_WITHDRAWN:
    title: "Ứng viên đã rút hồ sơ khỏi {jobTitle}"
    summary: "Một ứng viên đã rút hồ sơ khỏi vị trí {jobTitle}."
    body: |
      Một ứng viên đã rút hồ sơ khỏi vị trí **{jobTitle}**.
    actionLabel: "Xem hồ sơ ứng tuyển"

  ACCOUNT_RESTRICTED:
    title: "Tài khoản của bạn đã bị hạn chế"
    summary: "Tài khoản của bạn đang bị hạn chế truy cập một số tính năng."
    body: |
      Tài khoản của bạn đã bị hạn chế truy cập một số tính năng trên InterVue.

      **Lý do:** {reason}

      **Thời hạn:** {expiresAt}

      Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ bộ phận hỗ trợ để được xem xét lại.
    actionLabel: "Liên hệ hỗ trợ"

  ACCOUNT_RESTRICTION_LIFTED:
    title: "Tài khoản của bạn đã được khôi phục"
    summary: "Hạn chế trên tài khoản của bạn đã được gỡ bỏ."
    body: |
      Hạn chế trên tài khoản của bạn đã được gỡ bỏ. Bạn có thể sử dụng lại đầy đủ các tính năng của InterVue.
    actionLabel: "Về trang chủ"

  ACCOUNT_ROLES_CHANGED:
    title: "Quyền tài khoản của bạn đã thay đổi"
    summary: "Danh sách quyền truy cập trên tài khoản của bạn vừa được cập nhật."
    body: |
      Danh sách quyền truy cập trên tài khoản của bạn vừa được quản trị viên cập nhật.

      Bạn có thể cần đăng xuất và đăng nhập lại để thay đổi có hiệu lực đầy đủ.
    actionLabel: "Xem tài khoản"

  SECURITY_NEW_DEVICE_LOGIN:
    title: "Đăng nhập từ thiết bị mới"
    summary: "Có một lần đăng nhập mới từ {device} tại {location}."
    body: |
      Tài khoản của bạn vừa được đăng nhập từ một thiết bị chưa từng sử dụng trước đây.

      - **Thiết bị:** {device}
      - **Vị trí:** {location}
      - **Địa chỉ IP:** {ip}
      - **Thời điểm:** {at}

      Nếu đây là bạn, có thể bỏ qua thông báo này. Nếu không, hãy đổi mật khẩu và đăng xuất khỏi mọi thiết bị ngay lập tức.
    actionLabel: "Kiểm tra bảo mật"

  SECURITY_SETTING_CHANGED:
    title: "Thiết lập bảo mật đã thay đổi"
    summary: "{change}"
    body: |
      Một thiết lập bảo mật trên tài khoản của bạn vừa được thay đổi.

      **Chi tiết:** {change}

      Nếu không phải bạn thực hiện, hãy đổi mật khẩu ngay và liên hệ bộ phận hỗ trợ.
    actionLabel: "Kiểm tra bảo mật"

  IDENTITY_VERIFIED:
    title: "Danh tính của bạn đã được xác thực"
    summary: "Tài khoản của bạn đã được xác thực. Bạn có thể ứng tuyển ngay."
    body: |
      Quản trị viên đã duyệt hồ sơ xác thực danh tính của bạn.

      Tài khoản của bạn đã chuyển sang trạng thái **Đã xác thực**, bạn có thể nộp hồ sơ ứng tuyển.
    actionLabel: "Xem trạng thái"

  IDENTITY_REJECTED:
    title: "Hồ sơ xác thực danh tính bị từ chối"
    summary: "Lý do: {reason}"
    body: |
      Hồ sơ xác thực danh tính của bạn chưa được duyệt.

      **Lý do:** {reason}

      Bạn còn **{attemptsLeft}** lượt gửi lại. Hãy chụp lại giấy tờ rõ nét, đủ bốn góc và gửi lại hồ sơ.
    actionLabel: "Gửi lại hồ sơ"

  ADMIN_REVIEW_QUEUE_ITEM:
    title: "Hồ sơ mới chờ thẩm định: {queueLabel}"
    summary: "{companyName} vừa gửi hồ sơ vào hàng chờ {queueLabel}."
    body: |
      **{companyName}** vừa gửi một hồ sơ vào hàng chờ **{queueLabel}**.

      Hồ sơ đang chờ quản trị viên thẩm định.
    actionLabel: "Mở hàng chờ"
  ORDER_CREATED:
    title: "Đơn hàng {orderCode} đã được tạo"
    summary: "{buyerName} vừa tạo đơn hàng {orderCode} trị giá {totalAmount}."
    body: |
      **{buyerName}** vừa tạo đơn hàng **{orderCode}** cho doanh nghiệp.

      Tổng tiền (đã gồm VAT): **{totalAmount}**

      Đơn hàng được giữ đến **{expiresAt}**. Sau thời điểm này đơn sẽ tự hết hạn.
    actionLabel: "Xem đơn hàng"
  ORDER_PAID:
    title: "Đơn hàng {orderCode} đã thanh toán thành công"
    summary: "InterVue đã nhận được {paidAmount} cho đơn hàng {orderCode}."
    body: |
      InterVue đã nhận được thanh toán cho đơn hàng **{orderCode}**.

      Số tiền nhận được: **{paidAmount}**
    actionLabel: "Xem đơn hàng"
  ORDER_UNDERPAID:
    title: "Đơn hàng {orderCode} chưa đủ số tiền"
    summary: "Đơn {orderCode} còn thiếu {missingAmount}."
    body: |
      InterVue đã nhận được **{paidAmount}** cho đơn hàng **{orderCode}**, nhưng tổng đơn là **{totalAmount}**.

      Vui lòng chuyển bổ sung **{missingAmount}** với cùng nội dung chuyển khoản **{orderCode}** trước **{expiresAt}**.
    actionLabel: "Xem đơn hàng"
  ORDER_EXPIRED_UNDERPAID:
    title: "Đơn hàng {orderCode} đã hết hạn"
    summary: "Đơn {orderCode} chưa đủ tiền và đã hết hạn. InterVue sẽ liên hệ hoàn lại {paidAmount}."
    body: |
      Đơn hàng **{orderCode}** chưa được thanh toán đủ trong thời hạn giữ chỗ nên đã tự hết hạn.

      Số tiền bạn đã chuyển trước đó (**{paidAmount}**) sẽ được InterVue liên hệ hoàn lại thủ công.
    actionLabel: "Xem đơn hàng"
  ORDER_EXPIRED_WITH_PAYMENT:
    title: "Đơn {orderCode} hết hạn còn tiền chưa hoàn"
    summary: "Đơn {orderCode} đã hết hạn nhưng khách đã chuyển {paidAmount}, cần hoàn tiền thủ công."
    body: |
      Đơn hàng **{orderCode}** đã tự hết hạn vì chưa đủ tiền, nhưng khách đã chuyển **{paidAmount}**.

      Vui lòng kiểm tra tại trang Finance và chuyển khoản hoàn lại cho khách.
    actionLabel: "Mở danh sách đơn hàng"
  AD_CREATIVE_APPROVED:
    title: "Ảnh banner tuần {weekStart} đã được duyệt"
    summary: "Ảnh banner cho tuần {weekStart} đã được quản trị viên duyệt."
    body: |
      Ảnh banner bạn tải lên cho tuần **{weekStart}** đã được quản trị viên **duyệt**.

      Banner sẽ hiển thị đúng hạn khi tuần đó bắt đầu.
    actionLabel: "Xem banner của tôi"
  AD_CREATIVE_REJECTED:
    title: "Ảnh banner tuần {weekStart} bị từ chối"
    summary: "Ảnh banner cho tuần {weekStart} bị từ chối: {reason}"
    body: |
      Ảnh banner bạn tải lên cho tuần **{weekStart}** đã bị quản trị viên **từ chối**.

      Lý do: **{reason}**

      Vui lòng tải lại ảnh khác trước khi tuần này bắt đầu để banner không bị bỏ trống.
    actionLabel: "Tải ảnh khác"
  AD_WEEK_STARTING_SOON_NO_CREATIVE:
    title: "Tuần banner {weekStart} sắp chạy mà chưa có ảnh được duyệt"
    summary: "Tuần {weekStart} sắp bắt đầu nhưng banner của bạn chưa có ảnh được duyệt."
    body: |
      Tuần banner **{weekStart}** của bạn sắp bắt đầu nhưng chưa có ảnh được duyệt.

      Nếu không tải ảnh kịp, vị trí sẽ hiển thị nội dung mặc định của InterVue cho tuần này và sẽ **không được bù**.
    actionLabel: "Tải ảnh ngay"
  REFUND_APPROVED:
    title: "Hoàn tiền đơn {orderCode} đã được duyệt"
    summary: "InterVue đã duyệt hoàn {approvedAmount} cho đơn {orderCode}."
    body: |
      Yêu cầu hoàn tiền cho đơn hàng **{orderCode}** đã được quản trị viên duyệt.

      Số tiền hoàn: **{approvedAmount}**. InterVue sẽ chuyển khoản lại trong thời gian tới.
    actionLabel: "Xem đơn hàng"
  REFUND_REJECTED:
    title: "Hoàn tiền đơn {orderCode} bị từ chối"
