spring:
  application:
    name: intervue

  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:intervue_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:intervue}
    password: ${MYSQL_PASSWORD:changename}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from-name: InterVue
  support-email: ${SUPPORT_EMAIL:support@intervue.vn}
  geolocation:
    enabled: ${GEOLOCATION_ENABLED:false}

auth:
  email-verification-ttl: 24h
  password-reset-ttl: 15m
  resend-cooldown: 60s
  resend-max-attempts: 3
  resend-window: 15m
  login-fail-threshold: 3
  login-fail-window: 15m
  phone-otp-ttl: 5m
  phone-otp-max-attempts: 3

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.5-flash-lite
    max-tokens: 4096
    timeout: 60s
    max-retries: 2
  embedding:
    model: gemini-embedding-001
    dimensions: 768
  quota:
    user-per-day: 30
    ip-per-hour: 10

storage:
  cloudinary-url: ${CLOUDINARY_URL:}
  root-folder: ${CLOUDINARY_ROOT_FOLDER:intervue}
  max-document-size: 5MB
  max-image-size: 5MB
  fetch-timeout: 30s

tax-lookup:
  base-url: ${TAX_LOOKUP_BASE_URL:https://api.vietqr.io}
  timeout: 10s
  retry-after: 30s

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

sms:
  esms:
    base-url: https://rest.esms.vn
    api-key: ${ESMS_API_KEY:}
    secret-key: ${ESMS_SECRET_KEY:}
    brandname: ${ESMS_BRANDNAME:}
    sms-type: "2"
    timeout: 10s

jwt:
  secret: ${JWT_SECRET:a1M8O206XTw5ITl6NzReN3BKTTNVaWY1L1dnfWFPQjIjaysvV2F3Tm5fZA==}
  expiration: 900000
  issuer: InterVue
  refresh-token-ttl-days: 14

applications:
  require-identity-verification: ${APPLICATIONS_REQUIRE_IDENTITY_VERIFICATION:true}

---
spring:
  config:
    activate:
      on-profile: local

auth:
  resend-cooldown: 2s
  resend-max-attempts: 100
  resend-window: 15m

seed:
  accounts:
    admin:
      email: local.admin@intervue.test
      name: Local Admin
      roles: [ADMIN]
    candidate:
      email: local.candidate@intervue.test
      name: Local Candidate
      roles: [CANDIDATE]
  recruiters:
    recruiter:
      email: local.recruiter@intervue.test
      name: Local Recruiter
