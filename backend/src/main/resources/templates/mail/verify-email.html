<!doctype html>
<html lang="vi">
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6">
    <h2>Xác minh email InterVue</h2>
    <p>Xin chào {{name}},</p>
    <p>Cảm ơn bạn đã đăng ký InterVue. Vui lòng bấm nút bên dưới để xác minh địa chỉ email của bạn.</p>
    <p>
      <a
        href="{{link}}"
        style="display: inline-block; padding: 10px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px"
        >Xác minh email</a
      >
    </p>
    <p>Liên kết có hiệu lực trong {{expiry}} và chỉ sử dụng được một lần.</p>
    <p>Nếu bạn không thực hiện đăng ký này, hãy bỏ qua email.</p>
  </body>
</html>
